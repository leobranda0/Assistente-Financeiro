<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Assistente Financeiro</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Finanças"/>
  <meta name="theme-color" content="#0e0f14"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icon-v2-180.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --bg:#0e0f14;--bg1:#151720;--bg2:#1c1e28;--bg3:#22253200;
      --border:#ffffff0f;--border2:#ffffff18;
      --text:#f0f0f0;--text2:#888;--text3:#555;
      --accent:#5a5fff;--accent2:#9d9aff;--accent-bg:#5a5fff18;
      --green:#34d897;--green-bg:#34d89715;--green-border:#34d89730;
      --red:#f06060;--red-bg:#f0606015;--red-border:#f0606030;
      --orange:#fb923c;--orange-bg:#fb923c15;--orange-border:#fb923c30;
      --blue:#60a5fa;--blue-bg:#60a5fa15;
      --mono:'JetBrains Mono',monospace;
      --sans:'Inter',-apple-system,sans-serif;
      --radius:14px;--radius-sm:10px;--radius-xs:7px;
      --transition:all .2s cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;font-size:15px}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    input,select,button,textarea{font-family:inherit}
    #app{min-height:100vh;display:flex;flex-direction:column}

    /* ── Splash screen */
    .splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s ease}
    .splash.hidden{opacity:0;pointer-events:none}
    .splash-logo{font-size:52px;margin-bottom:16px;animation:pulse-in .6s ease}
    .splash-brand{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
    .splash-title{font-size:24px;font-weight:500;color:var(--text)}
    .splash-dots{display:flex;gap:6px;margin-top:24px}
    .splash-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);animation:dot-pulse 1.2s ease infinite}
    .splash-dot:nth-child(2){animation-delay:.2s}
    .splash-dot:nth-child(3){animation-delay:.4s}
    @keyframes dot-pulse{0%,80%,100%{background:var(--border2)}40%{background:var(--accent)}}
    @keyframes pulse-in{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

    /* ── Auth */
    .auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:calc(32px + env(safe-area-inset-top))}
    .auth-logo{font-size:44px;margin-bottom:14px}
    .auth-brand{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;text-align:center}
    .auth-title{font-size:24px;font-weight:500;color:var(--text);margin-bottom:28px;text-align:center}
    .auth-card{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:400px}
    .auth-tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--bg);border-radius:12px;padding:3px}
    .auth-tab{flex:1;background:transparent;border:none;color:var(--text3);font-size:14px;font-weight:500;padding:9px;border-radius:10px;cursor:pointer;transition:var(--transition)}
    .auth-tab.active{background:var(--bg2);color:var(--text)}
    .auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    .auth-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
    .auth-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:12px 14px;font-size:15px;width:100%;outline:none;transition:var(--transition);-webkit-appearance:none}
    .auth-input:focus{border-color:var(--accent)}
    .auth-input::placeholder{color:var(--text3)}
    .pass-wrap{position:relative}
    .pass-wrap .auth-input{padding-right:44px}
    .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text3);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
    .eye-btn:hover{color:var(--text2)}
    .remember-row{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
    .remember-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
    .remember-row label{font-size:13px;color:var(--text2);cursor:pointer}
    .auth-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);height:48px;font-size:15px;font-weight:500;cursor:pointer;margin-top:6px;transition:var(--transition)}
    .auth-btn:active{transform:scale(.98);opacity:.9}
    .auth-btn:disabled{opacity:.4;pointer-events:none}
    .auth-error{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);border-radius:var(--radius-xs);padding:11px 13px;font-size:13px;margin-top:10px;display:none}
    .auth-success{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:var(--radius-xs);padding:11px 13px;font-size:13px;margin-top:10px;display:none}
    .auth-footer{font-size:12px;color:var(--text3);text-align:center;margin-top:18px}
    .auth-link{background:transparent;border:none;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:12px;display:block;text-align:center}
    .reset-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}

    /* ── App shell */
    .header{padding:calc(14px + env(safe-area-inset-top)) 16px 0}
    .header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
    .brand-label{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
    .brand-title{font-size:20px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .sync-dot.syncing{background:var(--orange);animation:blink .7s ease infinite}
    .sync-dot.error{background:var(--red)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
    .header-right{display:flex;align-items:center;gap:6px}
    .icon-btn{background:var(--bg1);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:var(--radius-xs);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);font-size:16px}
    .icon-btn:active{transform:scale(.93);background:var(--bg2)}
    .icon-btn.accent{color:var(--accent);border-color:var(--accent-bg)}
    .month-pill{background:var(--bg1);border:1px solid var(--border);color:var(--accent2);font-size:12px;font-weight:500;padding:6px 11px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:var(--transition)}
    .month-pill:active{background:var(--bg2)}
    .btn-logout{background:transparent;border:1px solid var(--border);color:var(--text3);font-size:12px;padding:6px 10px;border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition)}
    .btn-logout:active{background:var(--bg2);color:var(--text)}
    .tabs{display:flex;gap:3px;background:var(--bg1);border-radius:14px;margin:0 16px 12px;padding:3px}
    .tab-btn{flex:1;background:transparent;border:none;cursor:pointer;font-size:12px;font-weight:400;padding:8px 4px;border-radius:11px;color:var(--text3);white-space:nowrap;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:4px}
    .tab-btn.active{background:var(--bg2);color:var(--text);font-weight:500}
    .tab-btn i{font-size:15px}
    .main{padding:0 16px calc(44px + env(safe-area-inset-bottom));flex:1;max-width:700px;margin:0 auto;width:100%}

    /* ── Cards */
    .card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;animation:fade-in .25s ease}
    @keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .section-lbl{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
    .input-field{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:11px 13px;font-size:15px;width:100%;outline:none;transition:var(--transition);-webkit-appearance:none}
    .input-field:focus{border-color:var(--accent)}
    .input-field::placeholder{color:var(--text3)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);height:46px;padding:0 20px;font-size:14px;font-weight:500;cursor:pointer;width:100%;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-primary:active{transform:scale(.98);opacity:.9}
    .btn-ghost{background:transparent;color:var(--text2);padding:8px 14px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition)}
    .btn-ghost:active{background:var(--bg2)}
    .feedback{padding:11px 13px;border-radius:var(--radius-xs);font-size:13px;margin-top:10px}
    .feedback-success{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .feedback-error{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

    /* ── Stat grid */
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;animation:fade-in .25s ease}
    .stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .stat-val{font-size:15px;font-weight:500;font-family:var(--mono);line-height:1}
    .stat-sub{font-size:9px;color:var(--text3);margin-top:4px;line-height:1.3}
    .c-green{color:var(--green)}.c-red{color:var(--red)}.c-gray{color:var(--text2)}.c-blue{color:var(--blue)}.c-accent{color:var(--accent2)}

    /* ── Expense / income rows */
    .exp-row{padding:12px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);transition:var(--transition)}
    .exp-row:last-child{border-bottom:none}
    .exp-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
    .exp-info{flex:1;min-width:0;overflow:hidden}
    .exp-name{font-weight:500;font-size:13px;color:var(--text);display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.3}
    .exp-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
    .exp-amt{font-family:var(--mono);font-weight:500;font-size:13px;flex-shrink:0;white-space:nowrap}
    .exp-actions{display:flex;gap:3px;flex-shrink:0}
    .act-btn{background:transparent;border:1px solid var(--border);color:var(--text3);padding:5px 7px;border-radius:var(--radius-xs);font-size:12px;cursor:pointer;transition:var(--transition);line-height:1}
    .act-btn:active{background:var(--bg2);transform:scale(.93)}
    .act-btn.danger{color:var(--red);border-color:var(--red-border)}
    .act-btn.stop{color:var(--accent2);border-color:var(--accent-bg)}
    .act-btn.success{color:var(--green);border-color:var(--green-border)}
    .act-btn *{pointer-events:none}
    .btn-primary *{pointer-events:none}

    /* ── Tags */
    .tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
    .tag-paid{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .tag-unpaid{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
    .tag-fixed{background:var(--accent-bg);color:var(--accent2);border:1px solid #5a5fff30}
    .tag-recv{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}

    /* ── Category bar */
    .cat-row{margin-bottom:12px}
    .cat-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .cat-name{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
    .cat-amt{font-size:13px;font-family:var(--mono);color:var(--text)}
    .cat-track{height:3px;background:var(--bg);border-radius:2px;overflow:hidden}
    .cat-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

    /* ── Goal card */
    .goal-card{background:linear-gradient(135deg,var(--bg1) 0%,#14152a 100%);border:1px solid #2e2e5a;border-radius:var(--radius);padding:18px;margin-bottom:12px;animation:fade-in .25s ease}
    .goal-amount{font-size:22px;font-weight:500;font-family:var(--mono);color:var(--accent2);margin:4px 0 12px}
    .goal-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:6px}
    .goal-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
    .goal-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}

    /* ── Hist bars */
    .hist-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .hist-lbl{font-size:12px;color:var(--text3);width:48px;flex-shrink:0;text-align:right}
    .hist-bars{flex:1;display:flex;flex-direction:column;gap:3px}
    .hist-bar-wrap{height:5px;background:var(--bg);border-radius:2px;overflow:hidden}
    .hist-bar-inc{height:100%;background:var(--green);border-radius:2px;transition:width .5s ease}
    .hist-bar-exp{height:100%;background:var(--red);border-radius:2px;transition:width .5s ease}

    /* ── Pending card */
    .pending-card{background:var(--bg1);border:1px solid var(--orange-border);border-radius:var(--radius);padding:16px;margin-bottom:12px;animation:fade-in .25s ease}

    /* ── Proj balance */
    .proj-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}

    /* ── Modals */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);animation:overlay-in .2s ease}
    @keyframes overlay-in{from{opacity:0}to{opacity:1}}
    @media(min-width:480px){.modal-overlay{align-items:center}}
    .modal{background:var(--bg1);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:480px;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:modal-in .25s cubic-bezier(.4,0,.2,1)}
    @keyframes modal-in{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @media(min-width:480px){.modal{border-radius:20px;padding-bottom:22px}}
    .modal-title{font-weight:500;font-size:16px;margin-bottom:16px;color:var(--text)}
    .modal-fields{display:flex;flex-direction:column;gap:9px}
    .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .modal-actions{display:flex;gap:8px;margin-top:14px}
    .modal-actions .btn-primary,.modal-actions .btn-ghost{flex:1;height:44px;font-size:14px}
    .empty{text-align:center;padding:32px 16px;color:var(--text3)}
    .empty-icon{font-size:32px;margin-bottom:10px}
    .empty-text{font-size:14px;color:var(--text2)}
    .empty-sub{font-size:12px;margin-top:4px;color:var(--text3)}

    /* ── Month picker */
    .mp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(6px)}
    @media(min-width:480px){.mp-overlay{align-items:center}}
    .mp-modal{background:var(--bg1);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:360px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    @media(min-width:480px){.mp-modal{border-radius:20px;padding-bottom:22px}}
    .mp-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
    .mp-year-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .mp-year-nav{background:transparent;border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:var(--radius-xs);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
    .mp-year-nav:active{background:var(--bg2)}
    .mp-year{font-size:17px;font-weight:500;color:var(--text)}
    .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .mp-month{background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:9px 6px;border-radius:var(--radius-xs);font-size:13px;cursor:pointer;text-align:center;transition:var(--transition)}
    .mp-month:active{transform:scale(.95)}
    .mp-month.is-active{background:var(--accent-bg);border-color:#5a5fff40;color:var(--accent2);font-weight:500}
    .stop-modal{background:var(--bg1);border:1px solid #2e2e5a;border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:380px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    @media(min-width:480px){.stop-modal{border-radius:20px;padding-bottom:22px}}

    /* ── Checkbox styled */
    .check-row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
    .check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
    .check-row label{font-size:14px;color:var(--text2);cursor:pointer;line-height:1.3}

    /* ── Future badge */
    .future-badge{display:inline-block;font-size:10px;font-weight:500;background:var(--accent-bg);color:var(--accent2);border:1px solid #5a5fff30;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}

    /* ── Animated counter */
    .animated-num{transition:all .5s cubic-bezier(.4,0,.2,1)}

    @media(max-width:380px){
      .stat-val{font-size:13px}.stat-card{padding:10px 7px}
      .exp-icon{width:28px;height:28px;font-size:13px}
      .exp-amt{font-size:12px}
      .act-btn{padding:4px 6px}
      .tab-btn{font-size:11px;gap:3px}
      .tab-btn i{font-size:13px}
      .brand-title{font-size:13px!important}
      .month-pill{font-size:11px;padding:5px 9px}
      .card{padding:13px}
    }
    @media(max-width:320px){
      .stat-grid{grid-template-columns:1fr 1fr;gap:6px}
      .stat-card:last-child{grid-column:span 2}
    }
    .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(90,95,255,.45);z-index:150;cursor:pointer}
    .fab:active{transform:scale(.94)}
    .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  </style>
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-logo">💰</div>
  <div class="splash-title" style="font-size:20px;letter-spacing:.06em">Assistente Financeiro</div>
  <div class="splash-dots">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>
<div id="app"></div>
<script src="voice.js?v=6"></script>

// Monthly expenses
function getExpMonth(monthKey){
  const r=[];
  for(const e of DB.expenses){
    const ok=keyOf(e.date);
    if(!e.recurrence||e.recurrence==='none'){if(ok===monthKey)r.push({...e})}
    else if(e.recurrence==='monthly'){
      if(monthKey<ok)continue;if(e.stopFrom&&monthKey>=e.stopFrom)continue;
      const ma=e.monthAmounts||{};
      let amt=ma[monthKey]!==undefined?ma[monthKey]:monthKey===ok?e.amount:e.zeroNextMonths?0:e.amount;
      r.push({...e,amount:amt,paid:!!(e.paidMonths||{})[monthKey],_ik:monthKey});
    }
  }
  return r.sort((a,b)=>b.date.localeCompare(a.date));
}
function getIncMonth(k){return DB.incomes.filter(i=>keyOf(i.date)===k)}

function getCumBal(upTo){
  const keys=new Set();
  DB.expenses.forEach(e=>{const ok=keyOf(e.date);if(ok<upTo)keys.add(ok)});
  DB.incomes.forEach(i=>{const ok=keyOf(i.date);if(ok<upTo)keys.add(ok)});
  DB.expenses.filter(e=>e.recurrence==='monthly').forEach(e=>{
    const ok=keyOf(e.date);let[y,m]=[+ok.split('-')[0],+ok.split('-')[1]];
    while(mkKey(y,m)<upTo){keys.add(mkKey(y,m));m++;if(m>12){m=1;y++;}}
  });
  let c=0;
  for(const mk of Array.from(keys).sort()){
    if(mk>=upTo)continue;
    c+=getIncMonth(mk).filter(i=>i.received!==false).reduce((s,i)=>s+i.amount,0);
    c-=getExpMonth(mk).filter(e=>e.paid).reduce((s,e)=>s+e.amount,0);
  }
  return c;
}

// History modal
function openHist(){
  const list=$('hist-list');if(!list)return;
  if(!HIST.length){list.innerHTML='<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px">Nenhuma alteração registrada.</div>';$('hist-overlay').style.display='flex';return}
  let out='';
  [...HIST].reverse().forEach(function(h,i){
    const idx=HIST.length-1-i,d=new Date(h.ts);
    const time=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),date=d.toLocaleDateString('pt-BR');
    out+='<div style="border-bottom:1px solid var(--border);padding:12px 0;display:flex;align-items:center;gap:12px;cursor:pointer" data-idx="'+idx+'" class="hist-item">'
    +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(h.label)+'</div>'
    +'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+date+' às '+time+'</div></div>'
    +'<div style="background:var(--accent-bg);border:1px solid #5a5fff30;color:var(--accent2);font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;flex-shrink:0">Desfazer</div></div>';
  });
  list.innerHTML=out;
  list.querySelectorAll('.hist-item').forEach(function(el){el.addEventListener('click',function(){undoTo(parseInt(el.dataset.idx))})});
  $('hist-overlay').style.display='flex';
}
function closeHist(){$('hist-overlay').style.display='none'}
async function undoTo(idx){
  if(idx<0||idx>=HIST.length)return;
  const s=HIST[idx];
  if(!confirm('Desfazer até "'+s.label+'"?\nIsso restaurará o estado anterior.'))return;
  closeHist();DB=JSON.parse(JSON.stringify(s.snap));HIST=HIST.slice(0,idx);saveCache();
  try{if(currentUser)localStorage.setItem('fin_hist_'+currentUser.id,JSON.stringify(HIST))}catch{}
  updHistBtn();renderMain();setSS('syncing');
  try{await sbFetch('/rest/v1/expenses?user_id=eq.'+currentUser.id,{method:'DELETE'});await sbFetch('/rest/v1/incomes?user_id=eq.'+currentUser.id,{method:'DELETE'});for(const e of DB.expenses){try{await upsExp(e)}catch{}}for(const i of DB.incomes){try{await upsInc(i)}catch{}}setSS('ok');showFb('success','✓ Alteração desfeita!')}
  catch{setSS('error');showFb('error','Dados restaurados localmente.')}
}

// ── PDF Report
function generatePDF(monthKey){
  const mExp=getExpMonth(monthKey),mInc=getIncMonth(monthKey);
  const mPaid=mExp.filter(e=>e.paid),mPend=mExp.filter(e=>!e.paid);
  const mRecv=mInc.filter(i=>i.received!==false),mPendInc=mInc.filter(i=>i.received===false);
  const tPaid=mPaid.reduce((s,e)=>s+e.amount,0),tRecv=mRecv.reduce((s,i)=>s+i.amount,0);
  const tPendAmt=mPend.reduce((s,e)=>s+e.amount,0);
  const prevBal=getCumBal(monthKey),realBal=prevBal+tRecv-tPaid;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,M=18;let y=M;
  // Header
  doc.setFillColor(14,15,20);doc.rect(0,0,W,32,'F');
  doc.setTextColor(157,154,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
  doc.text('ASSISTENTE FINANCEIRO',M,12);
  doc.setTextColor(240,240,240);doc.setFontSize(16);
  doc.text('Relatório — '+lbl(monthKey),M,22);
  doc.setTextColor(136,136,136);doc.setFontSize(8);
  doc.text('Gerado em '+new Date().toLocaleDateString('pt-BR'),W-M,22,{align:'right'});
  y=42;
  // Summary cards
  const cards=[
    {label:'Receitas recebidas',value:fmt(tRecv),color:[52,216,151]},
    {label:'Despesas pagas',value:fmt(tPaid),color:[240,96,96]},
    {label:'Saldo real',value:fmt(realBal),color:realBal>=0?[52,216,151]:[240,96,96]},
  ];
  cards.forEach(function(card,i){
    const x=M+i*58;
    doc.setFillColor(28,30,40);doc.roundedRect(x,y,54,22,3,3,'F');
    doc.setTextColor(card.color[0],card.color[1],card.color[2]);doc.setFontSize(7);doc.setFont('helvetica','bold');
    doc.text(card.label.toUpperCase(),x+4,y+7);
    doc.setFontSize(10);doc.text(card.value,x+4,y+16);
  });
  y+=30;
  // Pending notice
  if(mPend.length>0){
    doc.setFillColor(42,26,13);doc.roundedRect(M,y,W-M*2,10,2,2,'F');
    doc.setTextColor(251,146,60);doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text('⚠  '+mPend.length+' despesa(s) pendente(s) — '+fmt(tPendAmt),M+4,y+6.5);
    y+=14;
  }
  // Expenses section
  doc.setTextColor(90,95,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
  doc.text('DESPESAS DO MÊS',M,y);y+=6;
  doc.setDrawColor(255,255,255,20);doc.line(M,y,W-M,y);y+=4;
  [...mPaid,...mPend].forEach(function(e){
    if(y>270){doc.addPage();y=M;}
    doc.setTextColor(e.paid?136:251);doc.setFillColor(e.paid?52:251,e.paid?216:146,e.paid?151:60);
    doc.circle(M+2,y+1.5,1.5,'F');
    doc.setTextColor(220,220,220);doc.setFontSize(8);doc.setFont('helvetica','normal');
    const desc=e.description.length>35?e.description.slice(0,33)+'...':e.description;
    doc.text(desc,M+6,y+3);
    doc.setTextColor(136,136,136);doc.setFontSize(7);
    doc.text(e.category,M+6,y+8);doc.text(fmtD(e.date),M+70,y+8);
    doc.setTextColor(e.paid?52:240,e.paid?216:96,e.paid?151:96);doc.setFontSize(8);
    doc.text(fmt(e.amount),W-M,y+3,{align:'right'});
    doc.setTextColor(e.paid?52:251,e.paid?216:146,e.paid?151:60);doc.setFontSize(6);
    doc.text(e.paid?'Pago':'Pendente',W-M,y+8,{align:'right'});
    y+=13;doc.setDrawColor(34,37,50);doc.line(M,y-1,W-M,y-1);
  });
  y+=4;
  // Incomes section
  if(y>240){doc.addPage();y=M;}
  doc.setTextColor(90,95,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
  doc.text('RECEITAS DO MÊS',M,y);y+=6;
  doc.setDrawColor(255,255,255,20);doc.line(M,y,W-M,y);y+=4;
  [...mRecv,...mPendInc].forEach(function(i){
    if(y>270){doc.addPage();y=M;}
    doc.setFillColor(i.received?52:96,i.received?216:165,i.received?151:250);
    doc.circle(M+2,y+1.5,1.5,'F');
    doc.setTextColor(220,220,220);doc.setFontSize(8);doc.setFont('helvetica','normal');
    const desc=i.description.length>35?i.description.slice(0,33)+'...':i.description;
    doc.text(desc,M+6,y+3);
    doc.setTextColor(136,136,136);doc.setFontSize(7);doc.text(fmtD(i.date),M+6,y+8);
    doc.setTextColor(i.received?52:96,i.received?216:165,i.received?151:250);doc.setFontSize(8);
    doc.text(fmt(i.amount),W-M,y+3,{align:'right'});
    doc.setFontSize(6);doc.text(i.received?'Recebido':'A receber',W-M,y+8,{align:'right'});
    y+=13;doc.setDrawColor(34,37,50);doc.line(M,y-1,W-M,y-1);
  });
  // Footer
  doc.setFillColor(14,15,20);doc.rect(0,285,W,12,'F');
  doc.setTextColor(85,85,85);doc.setFontSize(7);
  doc.text('Assistente Financeiro — Relatório gerado automaticamente',W/2,292,{align:'center'});
  doc.save('relatorio-'+monthKey+'.pdf');
  showFb('success','✓ Relatório PDF salvo!');
}

// Check if all expenses are paid — show completion notification
function checkMonthComplete(monthKey){
  const mExp=getExpMonth(monthKey);
  if(mExp.length===0)return;
  const allPaid=mExp.every(e=>e.paid);
  if(!allPaid)return;
  const notifKey='notif_complete_'+monthKey+(currentUser?.id||'');
  if(localStorage.getItem(notifKey))return;
  localStorage.setItem(notifKey,'1');

  banner.style.cssText='position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;background:linear-gradient(135deg,#1a2a1e,#14251a);border:1px solid var(--green-border);border-radius:14px;padding:16px;z-index:400;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:modal-in .3s ease';
  banner.innerHTML='<div style="font-size:24px">🎉</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--green)">Mês concluído!</div><div style="font-size:12px;color:var(--text2);margin-top:2px">Todas as despesas de '+lbl(monthKey)+' foram pagas.</div></div>'
  +'<button data-action="banner-pdf" data-mk="'+monthKey+'" style="background:var(--green);color:#0e0f14;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">📄 PDF</button>'
  +'<button data-action="banner-close" style="background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer">✕</button>';
  document.body.appendChild(banner);
  banner.addEventListener('click',function(ev){
    const btn=ev.target.closest('[data-action]');if(!btn)return;

  setTimeout(function(){if(banner.parentElement)banner.remove()},8000);
}

    mRecv.forEach(function(inc){rih+='<div class="exp-row"><div class="exp-icon" style="background:var(--green-bg)"><i class="ti ti-trending-up" style="font-size:16px;color:var(--green)"></i></div><div class="exp-info"><div class="exp-name">'+esc(inc.description)+'<span class="tag tag-recv">Recebido</span></div><div class="exp-meta"><span>'+fmtD(inc.date)+'</span></div></div><div class="inc-amt" style="color:var(--green)">'+fmt(inc.amount)+'</div><div class="exp-actions"><button class="act-btn" data-action="recv" data-id="'+inc.id+'"><i class="ti ti-rotate-clockwise" style="font-size:13px"></i></button><button class="act-btn" data-action="edit-inc" data-id="'+inc.id+'"><i class="ti ti-pencil" style="font-size:13px"></i></button><button class="act-btn danger" data-action="del-inc" data-id="'+inc.id+'"><i class="ti ti-trash" style="font-size:13px"></i></button></div></div>'});
    rih+='</div></div>';h+=rih;
  }

  mc.innerHTML=h;

  // Re-bind form buttons (these are recreated with innerHTML)
  const expSearch=$('exp-search');if(expSearch)expSearch.addEventListener('input',function(){renderMain()});
  const expInp=$('exp-input');if(expInp)expInp.addEventListener('input',function(){const c=detectCat(expInp.value);const s=$('exp-cat');if(s&&c)s.value=c});
  const btnReg=$('btn-reg');if(btnReg)btnReg.addEventListener('click',addExpense);
  const btnInc=$('btn-add-inc');if(btnInc)btnInc.addEventListener('click',addIncome);



  // Pull-to-refresh removed to prevent touch conflicts
}


// (código de voz e avisos de vencimento: ver voice.js)

// ===== Notificações push =====
const VAPID_PUB='BNCHSFTODdVUJxieaksgpEim5CtISYObejqXYM_5Xfoxmht7YK2BgKDX-4TIJvTHuBh0LP5nBFVnRcdYjpFulEA';
function urlB64(b){const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
async function pushCurrent(){if(!pushSupported())return null;try{const r=await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}}
async function pushRefreshUI(){
  const b=$('btn-push');if(!b)return;
  const s=await pushCurrent();const on=!!s&&Notification.permission==='granted';
  b.innerHTML='<i class="ti '+(on?'ti-bell-ringing':'ti-bell-off')+'" style="font-size:16px"></i>';
  b.style.opacity=on?'1':'.55';b.classList.toggle('accent',on);b.title=on?'Avisos ativados':'Ativar avisos de vencimento';
}
async function pushSaveRow(sub){
  const j=sub.toJSON();
  await sbFetch('/rest/v1/push_subs?on_conflict=endpoint',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_id:currentUser.id})});
}
async function pushDropRow(unsub){
  const s=await pushCurrent();if(!s)return;
  try{await sbFetch('/rest/v1/push_subs?endpoint=eq.'+encodeURIComponent(s.endpoint),{method:'DELETE'})}catch(e){}
  if(unsub){try{await s.unsubscribe()}catch(e){}}
}
async function pushToggle(){
  if(!pushSupported()){vToast('Para ativar os avisos, instale o app na tela inicial (Compartilhar › Adicionar à Tela de Início) e abra por lá.',true);return}
  const cur=await pushCurrent();
  if(cur){await pushDropRow(true);vToast('Avisos desativados');pushRefreshUI();return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){vToast('Permissão negada. Libere em Ajustes › Notificações.',true);return}
    const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(VAPID_PUB)});
    await pushSaveRow(sub);
    try{await reg.showNotification('Avisos ativados ✅',{body:'Você será lembrado um dia antes de cada vencimento.',icon:'icon-v2-192.png'})}catch(e){}
    vToast('Avisos ativados');
  }catch(e){vToast('Não foi possível ativar: '+String(e.message||e).slice(0,90),true)}
  pushRefreshUI();
}
async function pushSync(){
  try{if(!pushSupported()||Notification.permission!=='granted')return;const s=await pushCurrent();if(s&&currentUser)await pushSaveRow(s)}catch(e){}
  pushRefreshUI();
}

// Init
async function initApp(){
  renderApp();const cached=loadCache();if(cached&&(cached.expenses.length+cached.incomes.length)>0){DB=cached;renderMain()}
  if(online()){
    try{setSS('syncing');await flushQ();const fresh=await cloudLoad();const cH=(fresh.expenses.length+fresh.incomes.length)>0,lH=cached&&(cached.expenses.length+cached.incomes.length)>0;
      if(cH){DB=fresh;saveCache();setSS('ok');renderMain()}
      else if(lH){setSS('syncing');for(const e of DB.expenses){try{await upsExp(e)}catch{}}for(const i of DB.incomes){try{await upsInc(i)}catch{}}setSS('ok')}
      else{DB={expenses:[],incomes:[]};saveCache();setSS('ok');renderMain()}
    }catch{setSS('error')}
  }else{setSS('error');showOff();if(!cached||!cached.expenses.length)renderMain()}
  hideSplash();pushSync();
}

// Bootstrap
(async function(){
  const hash=window.location.hash;
  if(hash&&hash.includes('type=recovery')){
    const params=new URLSearchParams(hash.replace('#',''));const at=params.get('access_token');
    if(at){currentSession={access_token:at};hideSplash();renderResetScreen();return}
  }
  try{const s=localStorage.getItem('fin_session');if(s){const sess=JSON.parse(s);const ref=await refreshSession(sess.refresh_token);if(ref&&ref.access_token){currentSession=ref;currentUser=ref.user;localStorage.setItem('fin_session',JSON.stringify({access_token:ref.access_token,refresh_token:ref.refresh_token,user:ref.user}));await initApp();return}}}catch{}
  hideSplash();renderAuth();
})();
</script>
